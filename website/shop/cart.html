<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Your bag — Keep Her Light Alive Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{gold:'#D4AF37',sand:'#F5F5F0',dark:'#111111',slate:'#F8FAFC',navy:'#0D2E47'}},fontFamily:{sans:['Inter','sans-serif'],serif:['Playfair Display','serif']}}}}</script>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="shared/shop.css">
</head>
<body class="font-sans">
<a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-[70] bg-brand-dark text-white px-4 py-2 rounded-full">Skip to content</a>
<header id="site-header" class="relative z-20 bg-white"></header>

<main id="main">
  <div class="max-w-[1100px] mx-auto px-5 lg:px-12 pt-8 lg:pt-14 pb-24">
    <h1 id="page-title" class="display font-serif text-4xl lg:text-5xl text-gray-900 mb-8"></h1>
    <div class="grid lg:grid-cols-12 gap-10 lg:gap-16 items-start">
      <div id="page-cart-body" class="lg:col-span-7"></div>
      <aside id="page-cart-foot" class="lg:col-span-5 lg:sticky lg:top-6 rounded-[1.5rem] bg-brand-sand p-6 lg:p-8 empty:hidden"></aside>
    </div>
  </div>
</main>

<footer id="site-footer" class="bg-black text-white pt-20 pb-10"></footer>

<script src="shared/shop.js"></script>
<script>
  KHLA.boot(() => {
    const render = () => {
      const c = KHLA.getCart();
      document.getElementById('page-title').textContent = `${KHLA.t('cart.title')}${c.items.length ? ` (${KHLA.count()})` : ''}`;
      document.getElementById('page-cart-body').innerHTML = KHLA.cartBodyHTML(c);
      document.getElementById('page-cart-foot').innerHTML = KHLA.cartFootHTML(c);
      // on the full page, "keep shopping" navigates instead of closing a drawer
      document.querySelectorAll('#main [data-close]').forEach(b => { b.removeAttribute('data-close'); b.addEventListener('click', () => location.href = 'index.html'); });
      KHLA.wireCart(document.getElementById('main'));
    };
    document.addEventListener('khla:cart', render);
    document.addEventListener('khla:lang', render);
    render();
    // the header cart button on this page should not open a drawer over the same content
    document.getElementById('cart-btn').onclick = (e) => { e.stopImmediatePropagation(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  });
</script>
</body>
</html>
