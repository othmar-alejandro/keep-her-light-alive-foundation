<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Thank you — Keep Her Light Alive Shop</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{gold:'#D4AF37',sand:'#F5F5F0',dark:'#111111',slate:'#F8FAFC',navy:'#0D2E47'}},fontFamily:{sans:['Inter','sans-serif'],serif:['Playfair Display','serif']}}}}</script>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="shared/shop.css">
</head>
<body class="font-sans">
<header id="site-header" class="relative z-20 bg-white"></header>

<main id="main">
  <div class="max-w-[1100px] mx-auto px-5 lg:px-12 pt-10 lg:pt-20 pb-24">
    <div class="grid lg:grid-cols-12 gap-10 lg:gap-16">
      <div class="lg:col-span-7">
        <div class="w-14 h-14 rounded-full bg-brand-gold grid place-items-center mb-6 reveal in"><i data-lucide="check" class="w-7 h-7 text-black"></i></div>
        <h1 id="ty-h1" class="display font-serif text-4xl lg:text-5xl text-gray-900 mb-3"></h1>
        <p class="text-gray-600 mb-1"><span data-i18n="ty.order"></span> <span id="ty-num" class="tnum font-medium text-gray-900"></span></p>
        <p id="ty-email" class="text-gray-600 mb-10"></p>

        <h2 class="font-medium text-lg mb-4" data-i18n="ty.next"></h2>
        <ol id="timeline" class="relative border-l border-black/10 ml-2 pl-7 space-y-7 mb-12"></ol>

        <div class="rounded-2xl bg-brand-sand p-6 mb-8 flex gap-4 items-start">
          <span class="w-9 h-9 rounded-full bg-white grid place-items-center shrink-0"><i data-lucide="sun" class="w-4 h-4" style="color:var(--gold-deep)"></i></span>
          <p class="text-gray-700 leading-relaxed" data-i18n="ty.mission"></p>
        </div>

        <div class="rounded-2xl border border-black/8 p-6 mb-8">
          <h3 class="font-medium text-lg mb-1" data-i18n="ty.account.h"></h3>
          <p class="text-gray-600 text-sm mb-4" data-i18n="ty.account.p"></p>
          <button type="button" id="acct-btn" class="btn-press inline-flex items-center gap-2 h-11 px-5 rounded-full bg-brand-dark text-white text-sm font-medium hover:bg-black"><i data-lucide="mail" class="w-4 h-4"></i><span data-i18n="ty.account.cta"></span></button>
        </div>

        <div class="flex flex-wrap items-center gap-3">
          <span class="text-sm text-gray-600" data-i18n="ty.share"></span>
          <a href="https://instagram.com/keepherlightalive" class="btn-press w-10 h-10 rounded-full border border-black/10 grid place-items-center hover:bg-black/5" aria-label="Instagram"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="16" height="16" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg></a>
          <button type="button" id="copy-btn" class="btn-press h-10 px-4 rounded-full border border-black/10 text-sm font-medium hover:bg-black/5" data-i18n="ty.copy"></button>
          <a href="index.html" class="ml-auto text-sm font-medium underline underline-offset-4" data-i18n="ty.back"></a>
        </div>
      </div>

      <aside class="lg:col-span-5 rounded-[1.5rem] bg-brand-sand p-6 lg:p-8 h-max">
        <h2 class="font-serif text-2xl mb-5" data-i18n="ty.summary"></h2>
        <ul id="ty-lines" class="divide-y divide-black/8 mb-5"></ul>
        <dl id="ty-totals" class="text-sm space-y-1.5 mb-6"></dl>
        <p id="ty-receipt" class="text-[12px] text-gray-600 leading-relaxed"></p>
        <p id="ty-receipt-gift" class="text-[12px] text-gray-600 leading-relaxed mt-3"></p>
      </aside>
    </div>
  </div>
</main>

<footer id="site-footer" class="bg-black text-white pt-20 pb-10"></footer>

<script src="shared/shop.js"></script>
<script>
  KHLA.boot(() => {
    const { t, L, money, esc } = KHLA;
    let o = null; try { o = JSON.parse(sessionStorage.getItem('khla_last_order')); } catch {}
    let sample = false;
    if (!o) { // demo order so the page can be reviewed directly
      sample = true;
      o = { items: [{ sku: 'KHLA-TEE-NVY-M', qty: 1 }, { sku: 'KHLA-COIN-1', qty: 2 }], fulfil: 'ship', donation: 1000, number: 'KHLA-1042', ts: Date.now() };
      o.totals = KHLA.totals({ items: o.items, fulfil: o.fulfil, donation: o.donation });
    }
    const name = 'Maria', email = 'maria@example.com';
    const render = () => {
      document.getElementById('ty-h1').textContent = t('ty.h1', { name });
      let rib = document.getElementById('sample-ribbon');
      if (sample) { if (!rib) { rib = document.createElement('p'); rib.id = 'sample-ribbon'; rib.className = 'inline-block text-[11px] uppercase tracking-[0.18em] font-semibold px-3 py-1 rounded-full bg-brand-gold/20 mb-6'; document.getElementById('ty-h1').before(rib); } rib.textContent = t('ty.sample'); }
      document.getElementById('ty-num').textContent = o.number;
      document.getElementById('ty-email').textContent = t('ty.email', { email });
      const steps = [[t('ty.s1'), t('ty.s1p'), true], [t('ty.s2'), t('ty.s2p'), false], o.fulfil === 'pickup' ? [t('ty.s3pick'), t('ty.s3pickp'), false] : [t('ty.s3'), t('ty.s3p'), false]];
      document.getElementById('timeline').innerHTML = steps.map(([h, p, done]) => `<li class="relative"><span class="absolute -left-[2.2rem] top-1 w-4 h-4 rounded-full ${done ? 'bg-brand-gold' : 'bg-white border-2 border-black/15'}"></span><p class="font-medium leading-tight">${esc(h)}</p><p class="text-sm text-gray-600">${esc(p)}</p></li>`).join('');
      document.getElementById('ty-lines').innerHTML = o.items.map(i => { const { p, v } = KHLA.variant(i.sku); return `<li class="flex gap-4 py-3"><div class="relative w-16 h-16 rounded-xl bg-white overflow-hidden shrink-0">${KHLA.imgOrPh(p.images[0], 'p-2', true)}</div><div class="flex-1 min-w-0"><p class="font-serif leading-snug">${esc(L(p.title))}</p><p class="text-sm text-gray-500">${esc(v.optionValue)} × ${i.qty}</p></div><p class="tnum">${money(p.priceCents * i.qty)}</p></li>`; }).join('');
      const T = o.totals;
      document.getElementById('ty-totals').innerHTML = `<div class="flex justify-between"><dt class="text-gray-600">${t('cart.subtotal')}</dt><dd class="tnum">${money(T.subtotal)}</dd></div>
        <div class="flex justify-between"><dt class="text-gray-600">${t('cart.shipping')}</dt><dd class="tnum">${T.shipping ? money(T.shipping) : t('cart.free')}</dd></div>
        <div class="flex justify-between"><dt class="text-gray-600">${t('ty.taxEst')}</dt><dd class="tnum">${money(Math.round(T.subtotal * 0.07))}</dd></div>
        ${T.donation ? `<div class="flex justify-between"><dt class="text-gray-600">${t('ty.donation')}</dt><dd class="tnum">${money(T.donation)}</dd></div>` : ''}
        <div class="flex justify-between pt-2 border-t border-black/10 font-medium text-base"><dt>Total</dt><dd class="tnum">${money(T.total + Math.round(T.subtotal * 0.07))}</dd></div>`;
      document.getElementById('ty-receipt').textContent = t('ty.receipt');
      document.getElementById('ty-receipt-gift').textContent = T.donation ? t('ty.receiptGift', { amt: money(T.donation) }) : '';
      KHLA.icons();
    };
    document.getElementById('acct-btn').addEventListener('click', (e) => { e.currentTarget.disabled = true; e.currentTarget.querySelector('span').textContent = t('ty.account.ok'); });
    document.getElementById('copy-btn').addEventListener('click', (e) => { navigator.clipboard?.writeText('https://keepherlightalive.com/shop'); e.currentTarget.textContent = t('ty.copied'); });
    document.addEventListener('khla:lang', render);
    render();
  });
</script>
</body>
</html>
